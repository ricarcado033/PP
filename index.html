<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una sorpresa para ti</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <!--Pantalla bloqueo-->
    <div id="pantalla-bloqueo" class="contenedor">
        <h2>Para la contaseña piensa en una fecha especial </h2>
        <input type="password" id="input-password" inputmode="numeric" placeholder="******" maxlength="6">
        <button id="btn-ingresar">Abrir</button>
        <p id="mensaje-error" class="oculto">Incorrecto, intenta de nuevo.</p>
        <p id="link-pista" class="oculto">¿Necesitas una pista?</p>
    </div>
 
    <!--Pantalla terminal-->
<div id="pantalla-terminal" class="terminal oculto">
    <div class="contenedor-terminal">
        <div class="terminal-header">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
        </div>
        <div id="terminal-log" class="terminal-body"></div>
    </div>
    <div class="barra-carga-fondo">
        <div id="barra-progreso" class="barra-carga-relleno"></div>
    </div>
    <p id="porcentaje-carga" class="porcentaje-carga">0%</p>
</div>

    <!--Pantalla sobre-->
    <div id="pantalla-sobre" class="contenedor oculto">
        <div id="contador-amor" class="contador-box">
        <p>🤭Juntitos por:</p>
        <div id="reloj">0 días, 0h 0m 0s</div>
    </div>

        <div class="sobre" id="sobre-interactivo">
            <div class="solapaArriba"></div>
            <div class="solapaDerecha"></div>
            <div class="solapaIzquierda"></div>
            <div class="solapaAbajo"></div>
            <div class="carta">
                <h3> Un dia...</h3>
                <p id="texto-maquina"></p>
            </div>
            <div class="frente"></div>
        </div>
        <p class="instruccion">Toca para abrir la carta</p>
    </div>
    <audio id="musicafondo" src="imagenes/ZOE - Labios Rotos (Unplugged).mp3"></audio>
    <audio id="sfx-tecla" src="imagenes/tecla.mp3"></audio>
    <audio id="sfx-error" src="imagenes/error.mp3"></audio>
    <audio id="sfx-carga" src="imagenes/cargando.mp3"></audio>
    <audio id="sfx-solapa" src="imagenes/papel.mp3"></audio>
    <script src="script.js"></script>
</body>
